[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yaptax"
version = "0.3.0"
description = "Measure the language tax in your AI prompts: how many more tokens your non-English users cost."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuroTitan Labs" }]
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.7"]
keywords = ["llm", "tokens", "tokenizer", "multilingual", "cost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
hf = ["tokenizers>=0.19", "huggingface_hub>=0.23"]
router = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "tomli>=2; python_version < '3.11'"]
test = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://neurotitan.in/cost"

[project.scripts]
yaptax = "yaptax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaptax = ["data/*.json", "router/*.json", "router/*.html"]
